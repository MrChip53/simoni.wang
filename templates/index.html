<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Shortener</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <script defer src="https://analytics.simoni.dev/script.js" data-website-id="188924a5-0801-4ca2-ad4b-18442ddf6d29"></script>
</head>
<body>
    <div class="bg-white dark-bg d-flex justify-content-center align-items-center vh-100 px-5">
        <div class="border shadow-sm p-4">
            <h1 class="display-6 font-weight-bold pb-3">Last 10 Links</h1>
            <ul class="list-group">
                {{range .}}
                <li class="list-group-item">
                    <a href="/{{.ID}}">{{.Url}}</a>
                    {{if .Slug}} (Slug: <a href="/s/{{.Slug}}">{{.Slug}}</a>){{end}}
                    <span class="text-muted">- Created at: {{.CreatedAt}}</span>
                    <form method="POST" action="/api/delete/{{.ID}}" class="d-inline float-end ms-2">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </li>
                {{end}}
            </ul>
        </div>
    </div>
</body>
</html>
